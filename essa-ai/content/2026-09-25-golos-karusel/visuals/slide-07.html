<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>07</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#000; }
.canvas { width:1080px; height:1350px; position:relative; overflow:hidden; background:linear-gradient(160deg, #292834 0%, #0D1015 55%, #16131F 100%); color:#F7F5FA;
  font-family:'Open Sans', sans-serif; padding:60px 68px 72px; display:flex; flex-direction:column; }
.acc { color:#A77BFF; }
b { font-weight:700; }
.head { display:flex; align-items:center; gap:26px; font-size:28px; position:relative; z-index:3; flex:none; }

.num { flex:none; width:92px; height:92px; border-radius:50%; background:#3A2A6B; color:#fff; display:flex;

.to { display:flex; align-items:center; justify-content:center; }

.k-cards .cards { flex:1; grid-auto-rows:1fr; margin-top:34px; }

.k-cards .c-text { font-size:33px; }

.bg-photo { position:absolute; inset:0; width:100%; height:100%; object-fit: cover; z-index:0; }

</style></head><body><div class="canvas k-text"><div class="head"><span class="cnt"><b>07</b> / 08</span><span class="line"></span><span class="lbl">ПРОВЕРКА</span></div><div class="fill"><h1 style="font-size:112px">Проверь<br><span class="acc">второй головой</span></h1><p class="body">Отдай пост и паспорт другой нейросети в отдельном чате. Она читает свежим взглядом и находит, где звучит <b>«не ты»</b>.</p><div class="rule"></div><div class="plate summary"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#A77BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><div class="sep"></div><div>А потом прочитай вслух.<br><span class="acc">На слух чужое слово слышно сразу.</span></div></div></div></div></body></html>
