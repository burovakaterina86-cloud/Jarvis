<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фон сторис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0D1015; }
  body { font-family: 'Open Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .canvas {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 80px;
  }
  .headline { font-family: 'Roboto Condensed', sans-serif;
               font-weight: 700; }

  .canvas { background: #0D1015; color: #F7F5FA; }
  .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%;
           top: -300px; left: -260px; pointer-events: none;
           background: radial-gradient(circle, rgba(113,88,231,0.35) 0%, transparent 70%); }
  .glow-2 { position: absolute; width: 640px; height: 640px; border-radius: 50%;
             bottom: -280px; right: -220px; pointer-events: none;
             background: radial-gradient(circle, rgba(200,191,231,0.22) 0%, transparent 70%); }
  .key-area { position: relative; z-index: 2; flex: 1; display: flex;
               flex-direction: column; justify-content: center; }
  .key { font-size: 104px; line-height: 0.97; letter-spacing: -0.01em;
          color: #F7F5FA; }
  .key em { font-style: normal; color: #9F87EC; }
  .accent-line { width: 120px; height: 8px; border-radius: 4px;
                  background: #7158E7; margin-bottom: 48px; }
  .caption { font-weight: 400; font-size: 38px;
              line-height: 1.42; color: #B8B4C2; margin-top: 40px; }
  .nickname { position: relative; z-index: 2; font-weight: 600;
               font-size: 24px; line-height: 1.3; letter-spacing: 0.08em;
               color: #B8B4C2; }

</style>
</head>
<body>
<div class="canvas" id="story">
  <div class="glow"></div>
  <div class="glow-2"></div>
  <div class="key-area">
    <div class="accent-line"></div>
    <div class="key headline">Что я больше не хочу делать руками?</div>
    <p class="caption">Разобрала это в новой карусели</p>
  </div>
  <div class="nickname">@studio_essa_ai</div>
</div>
</body>
</html>
