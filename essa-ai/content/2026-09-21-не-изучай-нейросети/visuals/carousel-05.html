<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Слайд 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0D1015; }
  body { font-family: 'Open Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .canvas {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 80px;
  }
  .headline { font-family: 'Roboto Condensed', sans-serif;
               font-weight: 700; }

  .canvas { background: #0D1015; color: #F7F5FA; }
  .blob { position: absolute; border-radius: 50%; pointer-events: none;
           width: 640px; height: 640px; top: -240px; right: -180px;
           background: radial-gradient(circle, rgba(113,88,231,0.35) 0%, transparent 70%); }
  .header { position: relative; z-index: 2; display: flex; align-items: center;
             justify-content: space-between; }
  .nickname { font-weight: 600; font-size: 24px;
               letter-spacing: 0.05em; color: #B8B4C2; }
  .slide-num { font-size: 24px; letter-spacing: 0.08em; color: #B8B4C2; }
  .body-area { position: relative; z-index: 2; flex: 1;
                display: flex; flex-direction: column; justify-content: center; }
  .tag { align-self: flex-start; font-weight: 600;
          font-size: 27px; line-height: 1.2;
          letter-spacing: 0.12em; text-transform: uppercase;
          color: #9F87EC; background: rgba(113,88,231,0.16);
          border: 2px solid rgba(113,88,231,0.38); border-radius: 16px;
          padding: 12px 28px; margin-bottom: 36px; }
  .hero { font-size: 72px; line-height: 1.08;
           letter-spacing: -0.01em; color: #F7F5FA; }
  .hero em { font-style: normal; color: #7158E7; }
  .accent-line { width: 96px; height: 8px; border-radius: 4px;
                  background: #7158E7; margin: 40px 0 32px; }
  .text { font-weight: 400; font-size: 38px;
           line-height: 1.42; color: #B8B4C2; max-width: 920px; }
  .footer { position: relative; z-index: 2; border-top: 2px solid rgba(247,245,250,0.14);
             padding-top: 28px; }

</style>
</head>
<body>
<div class="canvas" id="slide">
  <div class="blob"></div>
  <div class="header">
    <span class="nickname">@studio_essa_ai</span>
    <span class="slide-num headline">5 / 9</span>
  </div>
  <div class="body-area">
    <span class="tag">слом</span>
    <div class="hero headline">Это неверная постановка</div>
    
  </div>
  <div class="footer"></div>
</div>
</body>
</html>
