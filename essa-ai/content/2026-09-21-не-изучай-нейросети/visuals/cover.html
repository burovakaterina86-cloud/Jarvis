<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обложка поста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Open+Sans:wght@400;600;700&family=Marck+Script&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0D1015; }
  body { font-family: 'Open Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .canvas {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 80px;
  }
  .headline { font-family: 'Roboto Condensed', sans-serif;
               font-weight: 700; }

  .canvas { background: #F1F0FA; color: #14151A; }
  .glow { position: absolute; width: 760px; height: 760px; border-radius: 50%;
           top: -220px; right: -260px; pointer-events: none;
           background: radial-gradient(circle closest-side, rgba(200,191,231,0.55) 0%, transparent 100%); }
  .arc { position: absolute; width: 520px; height: 520px; border-radius: 50%;
          border: 2px solid rgba(139,99,218,0.38); bottom: -180px; right: -140px;
          pointer-events: none; }
  .pill-row { position: relative; z-index: 2; display: flex; align-items: center; gap: 24px; }
  .pill { font-weight: 600; font-size: 27px;
           line-height: 1.2; letter-spacing: 0.12em; text-transform: uppercase;
           color: #8B63DA; background: rgba(139,99,218,0.16);
           border: 2px solid rgba(139,99,218,0.38); border-radius: 999px;
           padding: 12px 32px; }
  .thin-line { flex: 1; height: 2px; background: rgba(139,99,218,0.38); }
  .hook-area { position: relative; z-index: 2; flex: 1; display: flex;
                flex-direction: column; justify-content: center; max-width: 640px; }
  .hook { font-size: 104px; line-height: 1.02; letter-spacing: -0.01em;
           color: #14151A; }
  .hook em { font-style: normal; color: #8B63DA; }
  .subtitle { font-weight: 400; font-size: 38px;
               line-height: 1.42; color: #686775; margin-top: 32px; }
  .microtext { position: relative; z-index: 2; font-weight: 600;
                font-size: 24px; line-height: 1.3; letter-spacing: 0.14em;
                text-transform: uppercase; color: #686775; }
  .photo-slot { position: absolute; z-index: 1; right: 0; bottom: 0;
                 width: 440px; height: 900px;
                 background: linear-gradient(180deg, transparent 0%, rgba(200,191,231,0.45) 100%); }

</style>
</head>
<body>
<div class="canvas" id="cover">
  <div class="glow"></div>
  <div class="photo-slot"></div>
  <div class="arc"></div>
  <div class="pill-row">
    <span class="pill">МОЙ ПОДХОД</span>
    <span class="thin-line"></span>
  </div>
  <div class="hook-area">
    <div class="hook headline">Тебе не нужно изучать нейросети</div>
    <p class="subtitle">Начни с одной задачи, а не с нового сервиса</p>
  </div>
  <div class="microtext">ТЕСТИРУЮ / АНАЛИЗИРУЮ / УЛУЧШАЮ</div>
</div>
</body>
</html>
