<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Слайд 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Open+Sans:wght@400;600;700&family=Marck+Script&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0D1015; }
  body { font-family: 'Open Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .canvas {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 80px;
  }
  .headline { font-family: 'Roboto Condensed', sans-serif;
               font-weight: 700; }

  .canvas { background: #0D1015; color: #F7F5FA; }
  .glow { position: absolute; border-radius: 50%; pointer-events: none;
           width: 900px; height: 900px; top: -300px; right: -260px;
           background: radial-gradient(circle closest-side, rgba(113,88,231,0.28) 0%, transparent 100%); }
  .glow-2 { position: absolute; border-radius: 50%; pointer-events: none;
             width: 760px; height: 760px; bottom: -320px; left: -280px;
             background: radial-gradient(circle closest-side, rgba(200,191,231,0.18) 0%, transparent 100%); }
  /* Шапка её второго эталона: `02 / 09`, тонкая линия через слайд, короткая
     метка справа. Двухстрочного тезиса тут больше нет — он был «хаотично». */
  .header { position: relative; z-index: 2; display: flex; align-items: center;
             gap: 28px; }
  .header-count { font-size: 27px; line-height: 1.2;
                   letter-spacing: 0.04em; white-space: nowrap; }
  .header-num { color: #FB9D5B; }
  .header-total { color: #B8B4C2; margin-left: 10px; }
  .header-line { flex: 1; height: 1px; background: rgba(247,245,250,0.45); }
  .header-label { font-weight: 600; font-size: 24px;
                   line-height: 1.3; letter-spacing: 0.18em; white-space: nowrap;
                   text-transform: uppercase; color: #B8B4C2; }
  .hero { position: relative; z-index: 2; margin-top: 40px; max-width: 78%;
           font-size: 84px; line-height: 1.08;
           letter-spacing: -0.01em; text-transform: uppercase; color: #F7F5FA;
           margin-bottom: 20px; }
  .hero-line { display: block; }
  .hero .accent, .hero em { font-style: normal; color: #FB9D5B; }
  .lead { position: relative; z-index: 2; font-weight: 400;
           font-size: 38px; line-height: 1.42; color: #F7F5FA;
           margin-top: 20px; max-width: 920px; }
  /* Оранжевая отбивка под текстовой колонкой — держит низ колонки (её 5..9). */
  .rule-accent { position: relative; z-index: 2; width: 150px; height: 8px;
                  border-radius: 4px; background: #FB9D5B; margin-top: 20px; }
  /* Текст слева, предметная сцена справа — её раскладка со скриншотом. */
  .canvas.scene .hero, .canvas.scene .lead { max-width: 56%; }
  .canvas.bottom-note { padding-bottom: 256px; }
  .stage { position: relative; z-index: 2; flex: 1; display: flex;
            flex-direction: column; justify-content: center; gap: 40px;
            margin-top: 20px; padding-bottom: 20px; }
  /* Графики нет — вертикаль между заголовком и подвалом не оставляем дырой:
     заголовок сам занимает тело слайда. */
  .hero.fill { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .steps { position: relative; flex: 1; display: flex;
            flex-direction: column; justify-content: center; }
  /* Соединение цепочки — отрезки между кружками, а не черта сквозь цифры:
     сквозная линия читалась как перечёркивание (её замечание 2026-09-22). */
  .step-link { flex: 0 0 auto; width: 44px; height: 4px; border-radius: 2px;
                background: #FB9D5B; margin-top: 52px; align-self: flex-start; }
  .steps-row { position: relative; display: flex; justify-content: space-between;
                align-items: flex-start; gap: 16px; }
  .step { flex: 1; text-align: center; }
  .step-dot { width: 108px; height: 108px; border-radius: 50%;
               margin: 0 auto; background: #9F87EC; color: #14151A;
               font-size: 35px; line-height: 108px;
               box-shadow: 0 0 64px rgba(113,88,231,0.55); }
  .step-icon { margin: 76px auto 26px; height: 59px; }
  .step-caption { font-family: 'Roboto Condensed', sans-serif;
                   font-weight: 700;
                   font-size: 35px; line-height: 1.15; color: #F7F5FA;
                   min-height: 80px; }
  .step-note { font-size: 24px; line-height: 1.3; margin-top: 38px;
                color: #B8B4C2; }
  /* Тело слайда занимает вертикаль от подзаголовка до нижней плашки: ряд
     растёт, пока не упрётся в её пропорцию из reference/3.webp — карточка
     не выше трети холста. Дальше лишнее уходит в отступы вокруг ряда. */
  .flow { flex: 1; max-height: 450px;
           display: flex; align-items: stretch; gap: 8px; }
  /* Карточка потока — в пропорции её reference/3.webp: около четверти холста
     по высоте. Это нижняя граница, а не растяжка: текст длиннее — карточка выше. */
  /* min-width: 0 — иначе длинное слово («ВОЗВРАЩЁННОЕ») не даёт карточке
     сузиться и ряд вылезает за правый край холста. */
  .flow-card { flex: 1 1 0; min-width: 0; overflow-wrap: break-word;
                display: flex; flex-direction: column; justify-content: center;
                border-radius: 24px;
                background: #292834; border: 2px solid
                rgba(113,88,231,0.28); padding: 40px 20px;
                box-shadow: inset 0 2px 0 rgba(247,245,250,0.1), inset 0 -2px 0 rgba(13,16,21,0.45), 0 24px 48px rgba(13,16,21,0.55); }
  .flow-card.accent { background: #C8BFE7; border-color: #FB9D5B;
                       box-shadow: 0 0 64px rgba(113,88,231,0.55); }
  .flow-card.accent .flow-title, .flow-card.accent .flow-note { color: #14151A; }
  /* Кегль подписи потока — базовый label: на четырёх карточках длинное слово
     («ВОЗВРАЩЁННОЕ») должно вставать в строку, а не ломаться переносом. */
  .flow-title { font-size: 27px; line-height: 1.15; margin-top: 18px;
                 text-transform: uppercase; color: #F7F5FA; }
  .flow-note { font-size: 24px; line-height: 1.3; margin-top: 14px;
                color: #B8B4C2; }
  .flow-arrow { align-self: center; font-size: 27px; color: #9F87EC; }
  .cards { flex: 1; display: grid; gap: 16px; grid-auto-rows: 1fr; }
  .card { border-radius: 24px; background: #292834;
           border: 2px solid rgba(113,88,231,0.28);
           padding: 20px; box-shadow: inset 0 2px 0 rgba(247,245,250,0.1), inset 0 -2px 0 rgba(13,16,21,0.45), 0 24px 48px rgba(13,16,21,0.55);
           display: flex; flex-direction: column; justify-content: center; }
  .card.accent { background: #C8BFE7; border-color: #FB9D5B;
                  box-shadow: 0 0 64px rgba(113,88,231,0.55); }
  .card.accent .card-title, .card.accent .card-note { color: #14151A; }
  .card-title { font-size: 30px; line-height: 1.15; margin-top: 16px;
                 text-transform: uppercase; color: #F7F5FA; }
  .card-note { font-size: 24px; line-height: 1.3; margin-top: 10px;
                color: #B8B4C2; }
  /* Скриншот — предметная сцена правой половины, как в её 5, 6 и 9 слайдах:
     не блок посреди колонки, а картинка, уходящая к краю холста. */
  .shot { position: absolute; z-index: 1; right: 0; bottom: 216px;
           width: 56%; display: flex; justify-content: flex-end; align-items: center; }
  .shot-img { display: block; max-width: 100%; max-height: 608px;
               width: auto; height: auto;
               object-fit: contain; border-radius: 24px;
               border: 2px solid rgba(113,88,231,0.38);
               box-shadow: 0 0 64px rgba(113,88,231,0.35); }
  .portrait { position: absolute; z-index: 1; right: 0; bottom: 0;
               width: 540px; height: 1190px;
               display: flex; align-items: flex-end; justify-content: flex-end; }
  .portrait-img { max-width: 100%; max-height: 100%; object-fit: contain;
                   -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 22%,
                     #000 100%), linear-gradient(270deg, #000 0%, #000 62%, transparent 100%);
                   -webkit-mask-composite: source-in;
                   mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 100%),
                     linear-gradient(270deg, #000 0%, #000 62%, transparent 100%);
                   mask-composite: intersect; }
  /* Плашка-сноска её слайда 04: оранжевый кружок `!`, вертикальная черта,
     первая строка белая, вторая сиреневая. */
  .summary { position: relative; z-index: 2; display: flex; align-items: center;
              gap: 20px; border-radius: 24px;
              background: #292834;
              border: 2px solid rgba(247,245,250,0.1);
              padding: 20px 40px; margin: 40px 0 20px;
              box-shadow: inset 0 2px 0 rgba(247,245,250,0.1), inset 0 -2px 0 rgba(13,16,21,0.45), 0 24px 48px rgba(13,16,21,0.55); }
  .summary-mark { flex: 0 0 auto; width: 77px; height: 77px;
                   border-radius: 50%; border: 2px solid #FB9D5B;
                   color: #FB9D5B; font-size: 33px;
                   line-height: 73px; text-align: center; }
  .summary-divider { flex: 0 0 auto; width: 2px;
                      height: 77px; background: rgba(247,245,250,0.22); }
  .summary-line { font-weight: 400; font-size: 31px;
                   line-height: 1.45; color: #F7F5FA; }
  .summary-line.accent { font-weight: 600;
                          color: #9F87EC; }
  .footer { position: relative; z-index: 2; display: flex; align-items: flex-end;
             justify-content: space-between; gap: 40px; min-height: 24px; }
  .footer-thesis { font-weight: 600; font-size: 24px;
                    line-height: 1.5; letter-spacing: 0.16em; text-transform: uppercase;
                    color: #B8B4C2; }
  /* Рукописные пометки: оранжевые, под наклоном, с рисованной стрелкой
     к тому, что комментируют. Их две-три на слайд (её слайды 5..9). */
  .hand-note { position: absolute; z-index: 4; display: flex; align-items: flex-start;
                width: 331px;
                font-family: 'Marck Script', cursive;
                font-size: 42px; line-height: 1.15; color: #FB9D5B; }
  .hand-text { display: block; }
  .hand-arrow { flex: 0 0 auto; width: 50px;
                 height: 67px; }
  .at-top-right { top: 162px; right: 40px; justify-content: flex-end; }
  .at-top-right .hand-text { transform: rotate(-7deg); }
  .at-top-right .hand-arrow { order: 2; margin-top: -8px; transform: scaleX(-1); }
  .at-bottom-left { bottom: 27px; left: 40px; }
  .at-bottom-left .hand-text { transform: rotate(-6deg); }
  .at-bottom-left .hand-arrow { order: 2; margin-top: 4px; }
  .at-mid-right { top: 634px; right: 40px; justify-content: flex-end; }
  .at-mid-right .hand-text { transform: rotate(-8deg); }
  .at-mid-right .hand-arrow { order: 2; margin-top: -6px; transform: scaleX(-1); }
  .at-top-left { top: 162px; left: 40px; }
  .at-top-left .hand-text { transform: rotate(-5deg); }
  .at-top-left .hand-arrow { order: 2; margin-top: 4px; }

</style>
</head>
<body>
<div class="canvas bottom-note" id="slide">
  <div class="glow"></div>
  <div class="glow-2"></div>
  <div class="portrait"><img class="portrait-img" src="katerina-portrait-cutout.png" alt="фото владелицы"></div>
  
  <div class="header"><div class="header-count headline"><span class="header-num">09</span><span class="header-total">/ 09</span></div><div class="header-line"></div><div class="header-label">Моя воронка</div></div>
  <div class="hero headline"><div class="hero-line">Не больше ИИ.</div><div class="hero-line"><span class="accent">Меньше лишней работы.</span></div></div>
  <p class="lead">Напиши в комментариях одну задачу,<br>которую хочешь перестать делать руками.</p>
  <div class="rule-accent"></div>
  
  <div class="hand-note at-bottom-left"><span class="hand-text">всё получится ♡</span><svg class="hand-arrow" viewBox="0 0 64 86" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M54 6C28 16 10 36 14 68"/><path d="M5 55l9 15 15-8"/></svg></div>
  
  <div class="footer">
    <div class="footer-thesis"></div>
  </div>
</div>
</body>
</html>
